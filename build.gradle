// order-service 빌드 설정. 팀 공통 기준: Java 21, Spring Boot 4.0.8, Gradle Wrapper 9.x.
plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.8'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.freshlink'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven {
        // common 라이브러리 (GitHub Packages). 읽기에도 read:packages 토큰이 필요하다. 각자 PC 환경 변수 GITHUB_ACTOR, GITHUB_TOKEN에 둔다
        url = uri("https://maven.pkg.github.com/sesac-freshlink/common")
        credentials {
            username = System.getenv("GITHUB_ACTOR")
            password = System.getenv("GITHUB_TOKEN")
        }
    }
}

dependencies {
    implementation 'com.freshlink:common:0.1.0'                               // 쪽지 DTO 7종, ErrorCode·BusinessException·ErrorResponse
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'        // REST API
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'      // MySQL 접근
    implementation 'org.springframework.boot:spring-boot-starter-validation'    // @Valid
    implementation 'org.springframework.boot:spring-boot-starter-actuator'      // /actuator/health
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'      // Swagger UI: /swagger-ui.html, /v3/api-docs
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'                  // /actuator/prometheus
    runtimeOnly 'com.mysql:mysql-connector-j'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'    // 테스트·로컬 실행 때 MySQL 컨테이너
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-mysql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
}
