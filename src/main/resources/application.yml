# order-service 기본 설정 (뼈대). 실제 값은 환경 변수나 Kubernetes Secret으로 넣는다.
# 프로필은 dev·prod 두 개. SPRING_PROFILES_ACTIVE로 고른다.
server:
  port: 8080

app:
  queue:
    # RESERVE·CONFIRM·RELEASE를 보내는 큐 (기획안 5장). 접두사 QUEUE_PREFIX는 필수 (기본값 없음, dev만 application-dev.yml에서 보충)
    commands: ${QUEUE_PREFIX}inventory-commands.fifo
    # RESERVED·RESERVE_FAILED를 받는 큐 (표준 큐, DLQ는 인프라가 붙인다)
    results: ${QUEUE_PREFIX}inventory-results
    # 화면 알림(새 픽업 주문·픽업 준비 완료)을 notification-service로 보내는 큐 (표준 큐, N-02)
    notifications: ${QUEUE_PREFIX}notification-events

  # 토스페이먼츠 결제 승인. 시크릿 키는 TOSS_SECRET_KEY로만 (커밋·출력 금지). 비어 있으면 결제 승인이 500으로 거절된다
  toss:
    base-url: ${TOSS_BASE_URL:https://api.tosspayments.com}
    secret-key: ${TOSS_SECRET_KEY:}
    connect-timeout: 3s
    read-timeout: 15s

freshlink:
  messaging:
    enabled: true                 # common Outbox 발행기·멱등 처리 켜기 (inventory·order만)

spring:
  application:
    name: order-service
  datasource:
    # dev·prod 모두 RDS. 주소는 환경 변수 DB_URL로 넣는다
    # IntelliJ에서 TestOrderServiceApplication으로 실행하면 Docker MySQL이 대신 붙는다 (DB_URL 불필요)
    url: ${DB_URL:}
    username: ${DB_USERNAME:order_app}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
        timezone:
          default_storage: NORMALIZE   # OffsetDateTime을 jdbc.time_zone(KST) 벽시계로 저장
  jackson:
    time-zone: Asia/Seoul         # 시각은 ISO-8601 +09:00
  cloud:
    aws:
      region:
        static: ${AWS_REGION:ap-northeast-2}
      sqs:
        queue-not-found-strategy: fail   # 큐가 없으면 만들지 않고 실패한다 (큐는 인프라가 만든다)
        observation-enabled: true        # 추적(할 일 16): 쪽지 속성 traceparent로 inventory까지 같은 traceId를 잇는다

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      probes:
        enabled: true             # /actuator/health/liveness, /readiness
  # 추적(할 일 16). 요청마다 traceId를 만들어 로그에 넣고, 다른 서비스를 부를 때 traceparent 헤더를 붙인다.
  # PC에는 Zipkin이 없어서 보내지 않는다. 클러스터에서는 gitops 차트(spring-service)가 환경 변수로 켜고 주소를 넣는다:
  #   MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENABLED=true, MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT=http://zipkin.observability:9411/api/v2/spans
  # JSON 로그(LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs)도 차트가 넣는다. PC 로그는 사람이 읽는 형식 그대로다.
  tracing:
    sampling:
      probability: 1.0            # MVP는 요청이 적어 전부 기록
    export:
      zipkin:
        enabled: false

# Flyway: src/main/resources/db/migration/V1__xxx.sql 부터 담당자가 채운다. 아직 파일이 없으면 경고만 찍고 지나간다.
