# order-service 기본 설정 (뼈대). 실제 값은 환경 변수나 Kubernetes Secret으로 넣는다.
# 프로필은 dev·prod 두 개. SPRING_PROFILES_ACTIVE로 고른다.
server:
  port: 8080

app:
  queue:
    # RESERVE·CONFIRM·RELEASE를 보내는 큐 (기획안 5장). 접두사 QUEUE_PREFIX는 필수 (기본값 없음, dev만 application-dev.yml에서 보충)
    commands: ${QUEUE_PREFIX}inventory-commands.fifo

freshlink:
  messaging:
    enabled: true                 # common Outbox 발행기·멱등 처리 켜기 (inventory·order만)

spring:
  application:
    name: order-service
  datasource:
    # dev·prod 모두 RDS. 주소는 환경 변수 DB_URL로 넣는다
    # IntelliJ에서 TestOrderServiceApplication으로 실행하면 Docker MySQL이 대신 붙는다 (DB_URL 불필요)
    url: ${DB_URL:}
    username: ${DB_USERNAME:order_app}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
        timezone:
          default_storage: NORMALIZE   # OffsetDateTime을 jdbc.time_zone(KST) 벽시계로 저장
  jackson:
    time-zone: Asia/Seoul         # 시각은 ISO-8601 +09:00
  cloud:
    aws:
      region:
        static: ${AWS_REGION:ap-northeast-2}

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      probes:
        enabled: true             # /actuator/health/liveness, /readiness

# Flyway: src/main/resources/db/migration/V1__xxx.sql 부터 담당자가 채운다. 아직 파일이 없으면 경고만 찍고 지나간다.
